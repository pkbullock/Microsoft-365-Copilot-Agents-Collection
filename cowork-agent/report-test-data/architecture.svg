<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title description">
  <title id="title">Test Data Reports Cowork plugin architecture</title>
  <desc id="description">Build and deployment, Cowork runtime and report, delegated OAuth, Copilot Studio agent, Power Platform environment, and separate Agent 365 governance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#435a78"/>
    </marker>
    <style>
      .bg { fill: #f5f7fb; }
      .panel { fill: #ffffff; stroke: #d3deeb; stroke-width: 2; }
      .box { fill: #eef4ff; stroke: #5883c4; stroke-width: 2; }
      .green { fill: #e9f8f2; stroke: #40a57d; stroke-width: 2; }
      .amber { fill: #fff8e6; stroke: #d6a64a; stroke-width: 2; }
      .purple { fill: #f4efff; stroke: #9874cf; stroke-width: 2; }
      .heading { font: 700 31px Arial, sans-serif; fill: #182b47; }
      .section { font: 700 22px Arial, sans-serif; fill: #243d60; }
      .name { font: 700 19px Arial, sans-serif; fill: #1d3454; }
      .text { font: 16px Arial, sans-serif; fill: #304966; }
      .small { font: 15px Arial, sans-serif; fill: #425975; }
      .line { fill: none; stroke: #435a78; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #876bb7; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1600" height="1170"/>
  <text class="heading" x="48" y="52">Test Data Reports: architecture</text>
  <text class="text" x="48" y="82">Build and provision, direct MCP runtime, delegated authentication, and separate governance</text>

  <rect class="panel" x="35" y="110" width="1530" height="210" rx="14"/>
  <text class="section" x="58" y="145">1  Build and provision</text>
  <rect class="box" x="65" y="170" width="310" height="110" rx="10"/>
  <text class="name" x="85" y="201">Developer + wiqd CLI</text>
  <text class="text" x="85" y="229">Create, validate, provision</text>
  <text class="text" x="85" y="252">Shared dev deployment</text>
  <rect class="box" x="490" y="170" width="380" height="110" rx="10"/>
  <text class="name" x="510" y="201">Plugin source / app package</text>
  <text class="text" x="510" y="229">Manifest + report skill + connector</text>
  <text class="text" x="510" y="252">Provision builds the app ZIP</text>
  <rect class="box" x="995" y="170" width="500" height="110" rx="10"/>
  <text class="name" x="1015" y="201">Microsoft 365 Copilot Cowork</text>
  <text class="text" x="1015" y="229">Provisioned plugin available for testing</text>
  <text class="text" x="1015" y="252">No tenant-wide publication implied</text>
  <path class="line" d="M375 225 H480"/>
  <path class="line" d="M870 225 H985"/>

  <rect class="panel" x="35" y="345" width="1530" height="510" rx="14"/>
  <text class="section" x="58" y="380">2  Runtime and authentication</text>
  <rect class="box" x="65" y="410" width="240" height="90" rx="10"/>
  <text class="name" x="85" y="442">Cowork user</text>
  <text class="text" x="85" y="471">Requests a report</text>
  <rect class="box" x="370" y="410" width="365" height="90" rx="10"/>
  <text class="name" x="390" y="442">Cowork + report skill</text>
  <text class="text" x="390" y="471">Call tool and process returned data</text>
  <rect class="green" x="800" y="410" width="330" height="90" rx="10"/>
  <text class="name" x="820" y="442">Remote MCP connector</text>
  <text class="text" x="820" y="471">OAuthPluginVault reference</text>
  <rect class="green" x="1195" y="410" width="300" height="90" rx="10"/>
  <text class="name" x="1215" y="442">MCP client channel</text>
  <text class="text" x="1215" y="471">Copilot Studio endpoint</text>
  <path class="line" d="M305 455 H360"/>
  <path class="line" d="M735 455 H790"/>
  <path class="line" d="M1130 455 H1185"/>

  <rect class="purple" x="65" y="580" width="310" height="110" rx="10"/>
  <text class="name" x="85" y="611">Teams Developer Portal</text>
  <text class="text" x="85" y="638">OAuth configuration reference</text>
  <text class="text" x="85" y="662">Connect / sign in on first use</text>
  <rect class="purple" x="445" y="580" width="365" height="110" rx="10"/>
  <text class="name" x="465" y="611">Microsoft Entra ID</text>
  <text class="text" x="465" y="638">Single-tenant client registration</text>
  <text class="text" x="465" y="662">Delegated MCS.InvokeAsMCP</text>
  <rect class="green" x="890" y="555" width="605" height="165" rx="10"/>
  <text class="name" x="910" y="588">Power Platform environment</text>
  <text class="text" x="910" y="615">United States | early release | Dataverse</text>
  <text class="text" x="910" y="644">Published Sample Data Generator agent</text>
  <text class="text" x="910" y="671">Checks signed-in user's access</text>
  <text class="small" x="910" y="696">Dataverse is an environment prerequisite, not a depicted data flow.</text>
  <path class="dash" d="M965 500 V530 H220 V570"/>
  <path class="line" d="M375 635 H435"/>
  <path class="dash" d="M810 635 H880"/>
  <path class="line" d="M1345 500 V545"/>

  <rect class="amber" x="370" y="750" width="700" height="75" rx="10"/>
  <text class="name" x="390" y="778">Markdown report delivered to user</text>
  <text class="text" x="390" y="804">Table + original MCP output + available server trace and client log</text>
  <path class="line" d="M700 500 V545 H835 V735 H700 V740"/>
  <text class="small" x="390" y="846">The skill creates the file; the user can download or open it.</text>

  <rect class="panel" x="35" y="880" width="1530" height="235" rx="14"/>
  <text class="section" x="58" y="915">3  Administration and governance (separate from direct runtime)</text>
  <rect class="amber" x="65" y="940" width="450" height="115" rx="10"/>
  <text class="name" x="85" y="972">Power Platform administrator</text>
  <text class="text" x="85" y="999">Creates environment and Dataverse</text>
  <text class="text" x="85" y="1024">Early release and licensing apply</text>
  <rect class="amber" x="575" y="940" width="450" height="115" rx="10"/>
  <text class="name" x="595" y="972">Entra administrator / app owner</text>
  <text class="text" x="595" y="999">Registers client, redirect and permission</text>
  <text class="text" x="595" y="1024">Admin consent when required</text>
  <rect class="amber" x="1085" y="940" width="410" height="115" rx="10"/>
  <text class="name" x="1105" y="972">Agent 365 / M365 admin center</text>
  <text class="text" x="1105" y="999">AI Reader: review where available</text>
  <text class="text" x="1105" y="1024">AI Administrator: approve BYO requests</text>
  <text class="small" x="65" y="1087">Agent 365 BYO registration is optional and separate; this direct Cowork connection is not shown as using its gateway.</text>
  <text class="small" x="48" y="1143">Architecture reflects configured intent. Live authentication, tool discovery and report generation remain unverified.</text>
</svg>
