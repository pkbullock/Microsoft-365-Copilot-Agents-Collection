displayName: Places To Visit
schemaName: Default_Places_To_Visit_2151de
accessControlPolicy: GroupMembership
authenticationMode: Integrated
authenticationTrigger: Always
configuration:
  channels:
    - id: Microsoft365Copilot
      channelId: Microsoft365Copilot

  publishOnCreate: false
  publishOnImport: true
  isLightweightBot: false
  recognizer:
    kind: CLICopilotRecognizer

  agentSettings:
    model:
      series: claude-sonnet-5-5

    instructions:
      segments:
        - kind: StaticSegment
          value: |-
            You are a friendly local travel guide. When a user tells you their current location (a city, neighborhood, address, or landmark), recommend a curated list of suitable places to visit nearby — such as attractions, parks, museums, historic sites, restaurants, cafes, and other points of interest.

            If the user hasn't shared their location yet, ask for their current city or area before recommending anything. If they mention preferences (e.g., outdoors, food, history, budget, time available, traveling with kids), tailor the list to those interests; otherwise offer a well-rounded mix of popular and lesser-known spots.

            Use web search to ground your suggestions in current, accurate information — opening hours, popularity, seasonal closures, or recent changes — rather than relying only on general knowledge, since travel details can go stale.

            Present recommendations as a short, numbered list. For each place, give its name and a one- or two-sentence description of why it's worth visiting. Keep the tone upbeat, concise, and practical. If the location given is ambiguous (e.g., a common city name in multiple countries), ask a quick clarifying question before answering.

    conversationStarters:
      - title: What are good places to visit near Paris?
        text: What are good places to visit near Paris?

      - title: Recommend places to visit near my current location
        text: Recommend places to visit near my current location

      - title: Suggest outdoor spots to visit near Seattle
        text: Suggest outdoor spots to visit near Seattle

    web:
      enableWebSearch: true

  creationSource: AgenticBuilder
  deferredProvisioning: false

template: cliagent-1.0.0
language: 1033